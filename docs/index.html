<!-- index.html -->

<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta name="author" content="Icret EasyImage2.0">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>EasyImage2.0 简单图床</title>
    <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico" />
    <link href="//fastly.jsdelivr.net/npm/docsify@4.13.0/lib/themes/vue.css" rel="stylesheet" integrity="sha384-jCK82M2ExfkqAO/MYBKMjP1qC4AvZ4/Duf2gVWOy3RPn26uz+KW5I+9S39za1Fqv" crossorigin="anonymous">
</head>

<body>
    <div id="app">EasyImage2.0 简单图床文档...</div>

    <script>
        window.$docsify = {
            name: '简单图床 | 文档',
            // homepage: '../README.md',
            repo: 'icret/EasyImages2.0',//渲染github挂件 配置本地或线上地址
            loadSidebar: true,   //开启侧边栏 使用_sidebar.md 
            subMaxLevel: 1,      //侧边栏层级最大层级2
            loadNavbar: true,    //加载导航栏 需要编写_navbar.md
            autoHeader: true,    //配合loadSidebar 自动添加标题
            coverpage: true,

            alias: {
                '/.*/_sidebar.md': '/_sidebar.md'
            },
            copyCode: {
                buttonText: '复制',
                errorText: '错误',
                successText: '复制成功'
            },
            count: {
                countable: true,
                fontsize: '0.9em',
                color: 'rgb(90,90,90)',
                language: 'chinese'
            },
            search: { //默认的全局搜索 详细参数请看插件文档
                maxAge: 86400000, // 过期时间，单位毫秒，默认一天
                paths: ['auto'], // or 'auto'
                placeholder: '搜索文档',
            },
            plugins: [
                function (hook) {
                    var footer = [
                        '<hr/>',
                        '<footer>',
                        '<span>Copyright ©Since 2018 <a href="//github.com/icret/EasyImages2.0" target="_blank">EasyImage</a> Develop By <a href="//github.com/icret" target="_blank">Icret</a>, Docs By <a href="//docsify.js.org/#/zh-cn/" target="_blank">Docsify</a>.</span>',
                        '</footer>'
                    ].join('');

                    hook.afterEach(function (html) {
                        return html + footer;
                    });
                },

                function (hook, vm) {
                    hook.beforeEach(function (html) {
                        var url = '//github.com/icret/EasyImages2.0/blob/master/docs/' + vm.route.file;
                        var editHtml = '<a href="' + url + '" target="_blank">📝 在GitHub上编辑</a>';

                        return (html + '<br/><br/><br/><br/><br/>' + editHtml);
                    });
                }
            ]
        }

        // 离线阅读
        if (typeof navigator.serviceWorker !== 'undefined') {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <!-- docsify的js依赖 -->
    <script src="//fastly.jsdelivr.net/npm/docsify@4.13.0/lib/docsify.min.js" integrity="sha384-tXGfSx41M+5eUlj0qoW02FQncTsBb9Ej8j3XnBIGzp4LG3Co7K92/lxIE2TymnFd" crossorigin="anonymous"></script>
    <!-- 全文搜索插件 -->
    <script src="//fastly.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/search.min.js" integrity="sha384-iLaIop48JKsRHk+gA5r4A4qOIst9t1CDltPqbGjaxGhHijGCZRdfLNXR5EYvffdH" crossorigin="anonymous"></script>
    <!-- 图片缩放插件 -->
    <script src="//fastly.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/zoom-image.min.js" integrity="sha384-mJdMKW8zOH0+f+ILJ2rkwdoEGzRmM2Ft+07YaWYTTXLbSUNgmd0CCNRkOtA7CjOW" crossorigin="anonymous"></script>
    <!-- 代码拷贝插件 -->
    <script src="//fastly.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js" integrity="sha384-t4d9b4/0dEBkoJ5e77XEPBrqJ790jbFQFmEaTbBqIlTDeGosM1AbZvC1NQwqTg+5" crossorigin="anonymous"></script>
    <!-- 代码高亮 -->
    <script src="//fastly.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js" integrity="sha384-9WmlN8ABpoFSSHvBGGjhvB3E/D8UkNB9HpLJjBQFC2VSQsM1odiQDv4NbEo+7l15" crossorigin="anonymous"></script>
    <!-- 外链脚本 -->
    <script src="//fastly.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/external-script.min.js" integrity="sha384-dATla6z98CccJpUA4MaUwhapbWiF1imvUV6z2RLOUJwB3thwGVdsmnAOKDxiYEV0" crossorigin="anonymous"></script>
    <!-- 字数统计 -->
    <script src="//fastly.jsdelivr.net/npm/docsify-count@1.1.0/dist/countable.js" integrity="sha384-icGJOehUE8xwuE6kTKHArUurn6/SUuMKJ+Rlp9zgBR8DkgYA+5o26akODP9umqqr" crossorigin="anonymous"></script>
    <!-- https://github.com/Sumsung524/docsify-backTop -->
    <script src="//fastly.jsdelivr.net/gh/Sumsung524/docsify-backTop@82bf369db4817ef9aa1d98e99842b2c25bb06dd9/dist/docsify-backTop.min.js" integrity="sha384-n3TxCXMOd+o8ziETgu2X4da0oB1tCEPnJHtep6vhycN10OXvuW8yKdH0Yiadupr5" crossorigin="anonymous"></script>
</body>

</html>
